# Ocultar la versión de Nginx en cabeceras y páginas de error
server_tokens off;

# Cabeceras de seguridad obligatorias (con 'always' para incluir respuestas de error)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'" always;